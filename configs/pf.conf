set skip on lo0

# OpenBSD
#match in all scrub (no-df random-id max-mss 1440)
# FreeBSD
#scrub in all no-df random-id max-mss 1440

block all

antispoof for { lo0, em0 }

#pass in quick inet6 proto ipv6-icmp icmp6-type { routeradv, neighbrsol, neighbradv }
pass in quick inet proto icmp icmp-type echoreq max-pkt-rate 100/10
pass in quick inet6 proto ipv6-icmp icmp6-type echoreq max-pkt-rate 100/10
pass in inet proto icmp
pass in inet6 proto ipv6-icmp

pass in proto tcp from any to port { 22, 80, 443 }

#pass in proto tcp from 123.123.123.123 to port 445

pass out all
