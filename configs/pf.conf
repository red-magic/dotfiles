set skip on lo0

# OpenBSD
#match in all scrub (no-df random-id max-mss 1440)
# FreeBSD
#scrub in all no-df random-id max-mss 1440

antispoof for { lo0, em0, em1 }

block all

pass in quick proto tcp from any to port { 22, 80, 443 }
#pass in quick proto tcp from 123.123.123.123 to port 445

# ICMP needed for basic IPv6
#pass in quick inet6 proto ipv6-icmp icmp6-type { routeradv, neighbrsol, neighbradv }

# Ping rate limit
pass in quick inet proto icmp icmp-type echoreq max-pkt-rate 100/10
pass in quick inet6 proto ipv6-icmp icmp6-type echoreq max-pkt-rate 100/10

# Block ping that exceeds rate limit
block in quick inet proto icmp icmp-type echoreq
block in quick inet6 proto ipv6-icmp icmp6-type echoreq

# Pass the rest of ICMP
pass in quick inet proto icmp
pass in quick inet6 proto ipv6-icmp

pass out all
