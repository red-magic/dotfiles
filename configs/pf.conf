set skip on lo0

# OpenBSD
#match in all scrub (no-df random-id max-mss 1440)
# FreeBSD
#scrub in all no-df random-id max-mss 1440

block all

antispoof for { lo0, em0 } inet

pass in inet proto tcp from any to port { 22, 80, 443 }

#pass in inet proto tcp from 123.123.123.123 to port 445

pass out inet all
