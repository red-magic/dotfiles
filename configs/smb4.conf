; testparm /usr/local/etc/smb4.conf

; Single user
[global]
server role = standalone server
security = user
server smb encrypt = required
server signing = mandatory

[storage]
path = /srv/samba/storage
valid users = smbuser
writable = yes
create mask = 0644
directory mask = 0755

; pw useradd smbuser -d /nonexistent -s /usr/sbin/nologin -c "Samba User"
; pdbedit -a -u smbuser
; chown smbuser:smbuser /srv/samba/storage
; chmod 0755 /srv/samba/storage

; Multiple users
[global]
server role = standalone server
security = user
server smb encrypt = required
server signing = mandatory

[storage]
path = /srv/samba/storage
valid users = @smbusers
writable = yes
create mask = 0644
directory mask = 2755

; pw groupadd smbusers
; pw useradd user1 -d /nonexistent -s /usr/sbin/nologin -c "Samba User" -G smbusers
; pw useradd user2 -d /nonexistent -s /usr/sbin/nologin -c "Samba User" -G smbusers
; pdbedit -a -u user1
; pdbedit -a -u user2
; chown root:smbusers /srv/samba/storage
; chmod 3775 /srv/samba/storage
