; testparm /usr/local/etc/smb4.conf
; service samba_server enable && reboot

; Single user
[global]
server role = standalone server
security = user
server smb encrypt = required
server signing = mandatory

[storage]
path = /srv/samba/storage
valid users = smbuser
writable = yes
create mask = 0644
directory mask = 0755

; pw useradd -d /nonexistent -s /usr/sbin/nologin -c "Samba User" smbuser
; pdbedit -a -u smbuser
; chown smbuser:smbuser /srv/samba/storage
; chmod 0755 /srv/samba/storage

; Multiple users
[global]
server role = standalone server
security = user
server smb encrypt = required
server signing = mandatory

[storage]
path = /srv/samba/storage
valid users = @smbusers
writable = yes
create mask = 0664
directory mask = 2775

; pw useradd -d /nonexistent -s /usr/sbin/nologin -c "Samba User" smbuser
; pw groupadd smbusers
; pw groupmod smbusers -m user1,user2
; pdbedit -a -u user1
; pdbedit -a -u user2
; chown smbuser:smbusers /srv/samba/storage
; chmod 2775 /srv/samba/storage

; Guest
[global]
server role = standalone server
security = user
server smb encrypt = required
server signing = mandatory
map to guest = Bad User
guest account = nobody

[storage]
path = /srv/samba/storage
guest ok = yes
writable = yes
create mask = 0666
directory mask = 0777

; chown nobody:nobody /srv/samba/storage
; chmod 0777 /srv/samba/storage
