flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;

		iifname lo accept

		fib saddr . iif oif missing drop

		#icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		icmp type echo-request limit rate over 10/second burst 5 packets drop
		icmpv6 type echo-request limit rate over 10/second burst 5 packets drop
		meta l4proto { icmp, ipv6-icmp } accept

		ct state invalid drop
		ct state { established, related } accept

		tcp dport { 22, 80, 443 } accept

		#tcp dport 27015 accept
		#udp dport 27015 accept

		#ip saddr 123.123.123.123 tcp dport 445 accept

		#ip saddr 123.123.123.123 tcp dport 27015 accept
		#ip saddr 123.123.123.123 udp dport 27015 accept
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}
}
