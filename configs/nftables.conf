flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;

		iifname lo accept

		#icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		icmp type echo-request limit rate over 10/second burst 5 packets drop
		icmpv6 type echo-request limit rate over 10/second burst 5 packets drop
		meta l4proto { icmp, ipv6-icmp } accept

		ct state { established, related } accept
		ct state invalid drop

		fib saddr . iif oif missing drop

		#iifname != lo ip saddr 127.0.0.0/8 drop
		#iifname != lo ip saddr ::1 drop
		#iifname != ens33 ip saddr 192.168.0.0/24 drop
		#iifname != ens33 ip saddr fd00::/64 drop
		#iifname != docker0 ip saddr 172.17.0.0/16 drop
		#iifname != ens33 ip saddr 123.123.123.123/32 drop

		tcp dport { 22, 80, 443 } accept

		#tcp dport 27015 accept
		#udp dport 27015 accept

		#ip saddr 123.123.123.123 tcp dport 445 accept

		#ip saddr 123.123.123.123 tcp dport 27015 accept
		#ip saddr 123.123.123.123 udp dport 27015 accept
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}
}
