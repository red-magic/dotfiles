services:
  cs16-server:
    build: .
    image: cs16-server
    container_name: cs16-server
    init: true
    #network_mode: host # For LAN admin access with IP
    ports:
      - "27015:27015/udp"
      #- "27015:27015/tcp"
      #- "26900:26900/udp"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    restart: unless-stopped
